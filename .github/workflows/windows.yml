# Builds with MSVC on a clean Windows runner, runs the unit tests and the
# Launch.exe smoke test. Independent check that the code is not tied to the
# cross-compiler used for the packaged build.
name: windows-build

on:
  push:
  workflow_dispatch:

jobs:
  msvc:
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v5
      # No -G: let CMake pick whichever Visual Studio the runner image has.
      - name: Configure
        run: |
          cmake --version
          cmake -S . -B build -A x64
      - name: Build
        run: cmake --build build --config Release --parallel
      - name: Unit tests
        run: ctest --test-dir build -C Release --output-on-failure
      - name: Launch.exe smoke test
        run: build\Release\Launch.exe --smoke-test
      - name: Results on a Windows host
        run: |
          mkdir ci-results
          build\Release\wb_results.exe ci-results --skip-io
      - uses: actions/upload-artifact@v5
        with:
          name: windows-ci-results
          path: ci-results
